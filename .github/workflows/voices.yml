name: Generate DocAura voices
on:
  push:
    paths: ["make_voices.py", ".github/workflows/voices.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: python make_voices.py
      - name: Commit voices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add voices
          git commit -m "Add generated voices" || echo "no changes"
          git push
